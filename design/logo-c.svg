  https://www.boost.org/LICENSE_1_0.txt)

  Concept c, for the owner's choice (Task 8): two linked rings, as the web's link sign is
  drawn. The first is open, a C for C++; the second closes over a W for the web, its lower half
  the W's two bowls. The C passes over the W, then behind it.
  Two colours: the C in ink, the W in the accent.
-->
<title id="title">webcpp</title>
<style>
.ink { stroke: #1d1d1f; }
.acc { stroke: #5b3fd9; }
@media (prefers-color-scheme: dark) {
  .ink { stroke: #f5f5f7; }
  .acc { stroke: #9d8cff; }
}
</style>
<defs>
  <!-- Where the C passes over the W, a gap in the W; where the W passes over the C, a gap in the C. -->
  <mask id="w-under" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <rect width="64" height="64" fill="#fff"/>
    <path d="M28.73 18.5A15 15 0 0 1 34.3 23.14" fill="none" stroke="#000" stroke-width="10"/>
  </mask>
  <mask id="c-under" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <rect width="64" height="64" fill="#fff"/>
    <path d="M32.45 46.54A7.5 15 0 0 1 28.53 41.58" fill="none" stroke="#000" stroke-width="10"/>
  </mask>
</defs>
<g fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
  <path class="ink" mask="url(#c-under)" d="M35.19 24.5A15 15 0 1 0 30.26 44.65"/>
  <path class="acc" mask="url(#w-under)" d="M26.8 32A15 15 0 0 1 56.8 32A7.5 15 0 0 1 41.8 32A7.5 15 0 0 1 26.8 32Z"/>
</g>
</svg>
