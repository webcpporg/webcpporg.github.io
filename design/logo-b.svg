  Concept b, for the owner's choice (Task 8): C++'s braces, { and }, whose middle points open
  into the web's angle brackets, < and >; each pair is one stroke, the two signs met.
  Two colours: the braces' hooks in ink, the angle brackets in the accent.
-->
<title id="title">webcpp</title>
<style>
.ink { stroke: #1d1d1f; }
.acc { stroke: #5b3fd9; }
@media (prefers-color-scheme: dark) {
  .ink { stroke: #f5f5f7; }
  .acc { stroke: #9d8cff; }
}
</style>
