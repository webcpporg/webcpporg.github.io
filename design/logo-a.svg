  Concept a, for the owner's choice (Task 8): a globe, the web's sign, whose two meridians are
  the upright strokes of C++'s two plus signs; the plus signs' bars stand on its equator.
  Two colours: the globe's rim in ink, the plus signs in the accent.
-->
<title id="title">webcpp</title>
<style>
.ink { stroke: #1d1d1f; }
.acc { stroke: #5b3fd9; }
@media (prefers-color-scheme: dark) {
  .ink { stroke: #f5f5f7; }
  .acc { stroke: #9d8cff; }
}
</style>
<g fill="none" stroke-width="5">
  <circle class="ink" cx="32" cy="32" r="26.5"/>
  <g class="acc">
    <ellipse cx="32" cy="32" rx="11" ry="26.5"/>
    <path d="M14 32H28M36 32H50"/>
  </g>
</g>
</svg>
